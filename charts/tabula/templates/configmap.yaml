apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tabula.fullname" . }}-config
  labels:
    {{- include "tabula.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  POSTGRES_HOST: {{ include "tabula.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "tabula.postgresPort" . | quote }}
  POSTGRES_USER: {{ include "tabula.postgresUser" . | quote }}
  POSTGRES_DB: {{ include "tabula.postgresDatabase" . | quote }}
  REDIS_URL: {{ include "tabula.redisUrl" . | quote }}
