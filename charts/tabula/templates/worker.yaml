{{- /* Scans and backfills through the platform APIs (the `default` queue). */ -}}
{{- include "tabula.celeryDeployment" (dict
      "root" $
      "name" "worker"
      "cfg" .Values.worker
      "image" (include "tabula.backendImage" .)
      "replicas" .Values.worker.replicas
      "args" (list "celery" "-A" "app.workers.celery_app.celery_app" "worker" "-Q" "default"
                   (printf "--concurrency=%v" .Values.worker.concurrency) "--loglevel=info")) }}
