server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Docker's embedded DNS. Using a variable for proxy_pass forces per-request
    # resolution, so nginx still boots when the backend isn't up yet (important
    # on TrueNAS where start order isn't guaranteed).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tabula_backend http://backend:8000;

    # Reverse-proxy the API so the SPA can use same-origin relative URLs
    # (no baked API host, no CORS). `backend` is the compose service name.
    location /api/ {
        proxy_pass $tabula_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large PDF exports can take a while to render.
        proxy_read_timeout 300s;
    }

    # Interactive API docs and the OpenAPI spec.
    location = /openapi.json { proxy_pass $tabula_backend/openapi.json; }
    location /docs           { proxy_pass $tabula_backend$request_uri; }
    location /redoc          { proxy_pass $tabula_backend$request_uri; }

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
