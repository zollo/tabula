# Base composition for Tabula. Suitable as-is for a simple deployment.
# For local development with hot-reload, `docker-compose.override.yml` is
# picked up automatically and layers dev conveniences on top.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabula}
      POSTGRES_DB: ${POSTGRES_DB:-tabula}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabula}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker only: queued work is rebuilt from Postgres, so nothing is persisted.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Runs DB migrations, then boots the API (REST at /api).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    # Celery worker + embedded beat: the scan scheduler, scans and backfills.
    # Run exactly one (beat must not double-fire).
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --beat --schedule=/tmp/celerybeat-schedule --loglevel=info
    # Override the backend image's HTTP healthcheck (the worker serves no HTTP);
    # ping the worker over the broker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping --timeout 10 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => SPA uses relative /api, which nginx proxies to the backend.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
